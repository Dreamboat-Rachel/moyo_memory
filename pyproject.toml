[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moyo-memory"
version = "0.2.0"
description = "A LangGraph-based structured user memory service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "alembic>=1.14",
  "httpx>=0.27",
  "langchain-openai>=0.3",
  "langgraph>=0.2.60",
  "pydantic-settings>=2.7",
  "pymysql>=1.1",
  "qdrant-client>=1.13",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
moyo-index-worker = "moyo_memory.index_worker:main"
moyo-evaluate-recall = "moyo_memory.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

